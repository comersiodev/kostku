<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nota Pembayaran - Kostku</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<!-- Library html2pdf buat download nota -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Kostku siap offline!"))
      .catch(err => console.log("Gagal daftar sw:", err));
  }
</script>

<style>
  @font-face{
    font-family: 'OswaldBold';
    src: url('oswald-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBold';
    src: url('firasanscondensed-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBook';
    src: url('firasanscondensed-book.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
  }

  :root{
    --abu: #888888;
    --abu-terang: #cccccc;
    --abu-tua: #1a1a1a;
    --gelap: #000000;
    --hijau: #4ade80;
    --merah: #ff6b6b;
    --biru: #38bdf8;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'FiraCondBook', sans-serif;
  }

  body{
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000000;
  }

  .bg-layer{
    position: fixed;
    inset: 0;
    background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjuCYRrpK_F7zIPk0QFsm4YqWoP3VZXyYORohocnvBauwuJc69m9Zqf9l4l080KOOrkP1C5Lc2AD94oE8o6fnbUf_lNziQKSW9VjrcOko3Y4lA6Q43XXqeoEJn6Do1h0JWVC7MQREoHPcxZ8K1WRm1ouayuhxKpKTTtB7W6jVPYQL2lFX6_O9izv360q7PA/s1376/1788971700934.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg-dim{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1;
  }

  /* TOP BAR */
  .mbanking-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(0, 0, 0, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .mbanking-brand-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .mbanking-brand {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.1rem;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .mbanking-brand span {
    color: var(--abu-terang);
  }

  .mbanking-greeting-top {
    font-size: 0.7rem;
    color: var(--abu-terang);
    font-family: 'FiraCondBold', sans-serif;
    margin-top: 1px;
    line-height: 1;
    text-transform: uppercase;
  }

  .topbar-right-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* TOP ACTION BUTTONS (DOWNLOAD & TOGGLE FOOTER ICON) */
  .top-action-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--abu);
    background: var(--abu-tua);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .top-action-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
  }

  .top-action-btn svg {
    width: 18px;
    height: 18px;
    fill: var(--abu-terang);
  }

  /* MAIN SCREEN */
  #screen-payment{
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 64px;
    padding-bottom: 90px;
    overflow-y: auto;
  }

  .nota-container-wrap {
    width: 92%;
    max-width: 360px;
    margin-top: 10px;
  }

  /* NOTA KERTAS PUTIH KLASIK */
  .nota-paper {
    background: #ffffff;
    color: #111111;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    font-family: 'FiraCondBook', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .nota-header-title {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.3rem;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #000;
    margin-bottom: 2px;
  }

  .nota-subtitle {
    font-size: 0.75rem;
    text-align: center;
    color: #555;
    margin-bottom: 14px;
    text-transform: uppercase;
    font-family: 'FiraCondBold', sans-serif;
  }

  .nota-divider {
    border: none;
    border-top: 1.5px dashed #bbb;
    margin: 10px 0;
  }

  .nota-info-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 6px;
  }

  .nota-info-row span:first-child {
    color: #666;
    font-family: 'FiraCondBold', sans-serif;
  }

  .nota-info-row span:last-child {
    color: #111;
    font-family: 'FiraCondBold', sans-serif;
  }

  .nota-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 0.8rem;
  }

  .nota-table th {
    background: #f0f0f0;
    color: #333;
    font-family: 'FiraCondBold', sans-serif;
    padding: 6px;
    text-align: left;
    border-bottom: 1.5px solid #ccc;
  }

  .nota-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    color: #222;
  }

  .nota-total-section {
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nota-total-label {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    color: #333;
    text-transform: uppercase;
  }

  .nota-total-value {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.1rem;
    color: #000;
  }

  /* BAGIAN METODE PEMBAYARAN DI NOTA */
  .nota-payment-box {
    margin-top: 14px;
    background: #fdfdfd;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }

  .nota-payment-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.75rem;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .nota-qris-img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin: 4px auto;
    display: block;
  }

  .nota-bank-detail {
    font-size: 0.85rem;
    color: #222;
    font-family: 'FiraCondBold', sans-serif;
  }

  .nota-footer-note {
    font-size: 0.65rem;
    text-align: center;
    color: #777;
    margin-top: 16px;
    font-style: italic;
  }

  /* CUSTOM ALERT BOX */
  .custom-modal-box {
    background: #0d0d0d;
    border: 2px solid var(--abu-terang);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .custom-modal-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 1.1rem;
    color: var(--abu-terang);
    margin-bottom: 8px;
  }

  .custom-modal-msg {
    font-size: 0.9rem;
    color: #ddd;
    margin-bottom: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .custom-modal-btn.primary {
    background: var(--abu-terang);
    color: #000;
    border: none;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    font-family: 'FiraCondBold', sans-serif;
    cursor: pointer;
  }

  .popupBox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    padding: 20px;
  }

  .popupBox.active {
    display: flex;
  }

  /* BOTTOM NAVBAR */
  .mbanking-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: rgba(0, 0, 0, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    z-index: 99999;
    backdrop-filter: blur(8px);
    transition: transform 0.3s ease;
  }

  .mbanking-bottom-nav.hidden {
    transform: translateY(100%);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #888;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.55rem;
    gap: 3px;
    padding: 4px 2px;
    transition: color 0.2s;
    cursor: pointer;
    background: none;
    border: none;
    min-width: 0;
  }

  .nav-item span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .nav-item.active, .nav-item:hover {
    color: var(--abu-terang);
  }
</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- TOP BAR -->
  <div class="mbanking-topbar">
    <div class="mbanking-brand-container">
      <div class="mbanking-brand">Kost<span>ku</span></div>
      <div class="mbanking-greeting-top">Nota Pembayaran</div>
    </div>
    
    <div class="topbar-right-wrap">
      <!-- Tombol Toggle Sembunyikan/Tampilkan Footer (Icon Mata SVG) -->
      <button type="button" class="top-action-btn" id="toggleFooterIconBtn" onclick="toggleFooterBar()" title="Sembunyikan/Tampilkan Footer">
        <svg id="eyeIconSvg" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>

      <!-- Tombol Download Nota PDF SVG -->
      <button type="button" class="top-action-btn" onclick="downloadNotaPDF()" title="Download Nota PDF">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="screen-payment">

    <!-- AREA KERTAS NOTA PUTIH (YANG AKAN DIDOWNLOAD) -->
    <div class="nota-container-wrap" id="notaPrintArea">
      <div class="nota-paper">
        <div class="nota-header-title">Kostku Billing</div>
        <div class="nota-subtitle">Nota Tagihan Resmi</div>
        
        <hr class="nota-divider">

        <div class="nota-info-row">
          <span>Tanggal:</span>
          <span id="notaRealtimeDate">-</span>
        </div>
        <div class="nota-info-row">
          <span>Ditagihkan Kepada:</span>
          <span id="notaTargetName">Pelanggan Kostku</span>
        </div>

        <hr class="nota-divider">

        <table class="nota-table">
          <thead>
            <tr>
              <th>Rincian Utang / Item</th>
              <th style="text-align:right;">Nominal</th>
            </tr>
          </thead>
          <tbody id="notaTableBody">
            <!-- Data item diisi via JS -->
          </tbody>
        </table>

        <div class="nota-total-section">
          <div class="nota-total-label">Total Tagihan</div>
          <div class="nota-total-value" id="notaTotalNominal">Rp 0</div>
        </div>

        <!-- BAGIAN METODE PEMBAYARAN -->
        <div class="nota-payment-box" id="notaPaymentMethodBox">
          <div class="nota-payment-title">Metode Pembayaran</div>
          <div id="notaPaymentContent">-</div>
        </div>

        <div class="nota-footer-note">Terima kasih telah melakukan pembayaran tepat waktu. Simpan nota ini sebagai bukti sah.</div>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAVBAR -->
  <nav class="mbanking-bottom-nav" id="bottomNav"></nav>

  <!-- CUSTOM ALERT MODAL -->
  <div id="customModalOverlay" class="popupBox">
    <div class="custom-modal-box">
      <div class="custom-modal-title" id="customModalTitle">Informasi</div>
      <div class="custom-modal-msg" id="customModalMsg">Pesan...</div>
      <button type="button" class="custom-modal-btn primary" onclick="closeCustomModal()">OK</button>
    </div>
  </div>

  <script>
    function showCustomAlert(message, title = "Informasi") {
      document.getElementById("customModalTitle").innerText = title;
      document.getElementById("customModalMsg").innerText = message;
      document.getElementById("customModalOverlay").classList.add("active");
    }

    function closeCustomModal() {
      document.getElementById("customModalOverlay").classList.remove("active");
    }

    window.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      document.getElementById("notaRealtimeDate").innerText = now.toLocaleDateString('id-ID', options);

      loadDataAndRenderNota();
    });

    let savedMetodeList = [];
    let savedPiutangList = [];
    let selectedMetodeIdx = 0;

    function formatIDR(num) {
      num = Math.round(num);
      return "Rp " + num.toLocaleString('id-ID');
    }

    function loadDataAndRenderNota() {
      try {
        savedMetodeList = JSON.parse(localStorage.getItem("kostku_metode_pembayaran") || "[]");
      } catch(e) { savedMetodeList = []; }

      try {
        savedPiutangList = JSON.parse(localStorage.getItem("kostku_data_piutang") || "[]");
      } catch(e) { savedPiutangList = []; }

      // Ambil index metode pembayaran yang dipilih dari utang.html
      try {
        const preferredIdx = localStorage.getItem("kostku_selected_metode_idx");
        if (preferredIdx !== null) {
          selectedMetodeIdx = parseInt(preferredIdx);
        }
      } catch(e) {}

      // Render target & tabel piutang aktif
      let activeTargetName = "Pelanggan Kostku";
      let tableHtml = "";
      let grandTotal = 0;

      const activePiutang = savedPiutangList.filter(p => p.status !== 'lunas');
      if (activePiutang.length > 0) {
        activeTargetName = activePiutang[0].nama || "Pelanggan Kostku";
        tableHtml = activePiutang.map(p => {
          grandTotal += parseFloat(p.nominal || 0);
          return `
            <tr>
              <td><b>${p.nama}</b><br><span style="font-size:0.7rem; color:#666;">${p.catatan || 'Utang/Tagihan'}</span></td>
              <td style="text-align:right; font-family:'FiraCondBold',sans-serif;">${formatIDR(p.nominal)}</td>
            </tr>
          `;
        }).join("");
      } else {
        tableHtml = `<tr><td colspan="2" style="text-align:center; color:#666;">Tidak ada tagihan aktif</td></tr>`;
      }

      document.getElementById("notaTargetName").innerText = activeTargetName;
      document.getElementById("notaTableBody").innerHTML = tableHtml;
      document.getElementById("notaTotalNominal").innerText = formatIDR(grandTotal);

      renderNotaPaymentMethod();
    }

    function renderNotaPaymentMethod() {
      const contentBox = document.getElementById("notaPaymentContent");

      if (savedMetodeList.length === 0 || selectedMetodeIdx >= savedMetodeList.length) {
        contentBox.innerHTML = `<span style="color:#666; font-size:0.75rem;">Belum ada metode pembayaran</span>`;
        return;
      }

      const m = savedMetodeList[selectedMetodeIdx];
      if (m.tipe === 'QRIS') {
        contentBox.innerHTML = `
          <div style="font-size:0.75rem; font-family:'FiraCondBold',sans-serif; margin-bottom:4px;">Scan QRIS di bawah ini:</div>
          ${m.qrisImg ? `<img src="${m.qrisImg}" class="nota-qris-img" alt="QRIS">` : '<div style="color:red; font-size:0.7rem;">Gambar QRIS tidak ditemukan</div>'}
        `;
      } else {
        contentBox.innerHTML = `
          <div class="nota-bank-detail">${m.tipe} - ${m.namaProvider}</div>
          <div style="font-size:0.95rem; font-family:'OswaldBold',sans-serif; color:#000; margin-top:2px;">${m.nomorAkun}</div>
          <div style="font-size:0.75rem; color:#555; margin-top:1px;">a.n ${m.atasNama}</div>
        `;
      }
    }

    // Toggle Footer Bar via Icon Mata SVG
    let isFooterHidden = false;
    function toggleFooterBar() {
      const nav = document.getElementById("bottomNav");
      const iconSvg = document.getElementById("eyeIconSvg");
      isFooterHidden = !isFooterHidden;

      if (isFooterHidden) {
        nav.classList.add("hidden");
        iconSvg.innerHTML = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>`;
      } else {
        nav.classList.remove("hidden");
        iconSvg.innerHTML = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
      }
    }

    // Download Nota PDF (Murni hanya area #notaPrintArea yang didownload)
    function downloadNotaPDF() {
      const element = document.getElementById("notaPrintArea");
      const opt = {
        margin:       10,
        filename:     'Nota_Tagihan_Kostku.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a5', orientation: 'portrait' }
      };

      showCustomAlert("Menyiapkan file PDF nota...", "Download");
      html2pdf().from(element).set(opt).save().then(() => {
        closeCustomModal();
      });
    }

    const navItems = [
      { href: "index.html",          label: "Home",
        svg: `<path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3l9-8z"/>` },
      { href: "kelola-uang.html",    label: "Uang",
        svg: `<path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>` },
      { href: "utang.html",          label: "Utang",
        svg: `<path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>` },
      { href: "payment.html",        label: "Payment", active: true,
        svg: `<path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4V8h16v10zm-2-6h-2v2h2v-2z"/>` },
      { href: "penagihan.html",      label: "Penagihan",
