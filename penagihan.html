<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penagihan - Kostku</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Kostku siap offline!"))
      .catch(err => console.log("Gagal daftar sw:", err));
  }
</script>

<style>
  @font-face{
    font-family: 'OswaldBold';
    src: url('oswald-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBold';
    src: url('firasanscondensed-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBook';
    src: url('firasanscondensed-book.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
  }

  :root{
    --abu: #888888;
    --abu-terang: #cccccc;
    --abu-tua: #1a1a1a;
    --gelap: #000000;
    --hijau: #4ade80;
    --kuning: #ffd166;
    --merah: #ff6b6b;
    --biru: #38bdf8;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'FiraCondBook', sans-serif;
  }

  body{
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000000;
  }

  .bg-layer{
    position: fixed;
    inset: 0;
    background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjuCYRrpK_F7zIPk0QFsm4YqWoP3VZXyYORohocnvBauwuJc69m9Zqf9l4l080KOOrkP1C5Lc2AD94oE8o6fnbUf_lNziQKSW9VjrcOko3Y4lA6Q43XXqeoEJn6Do1h0JWVC7MQREoHPcxZ8K1WRm1ouayuhxKpKTTtB7W6jVPYQL2lFX6_O9izv360q7PA/s1376/1788971700934.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg-dim{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1;
  }

  /* TOP BAR */
  .mbanking-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(0, 0, 0, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .mbanking-brand-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .mbanking-brand {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.1rem;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .mbanking-brand span {
    color: var(--abu-terang);
  }

  .mbanking-greeting-top {
    font-size: 0.7rem;
    color: var(--abu-terang);
    font-family: 'FiraCondBold', sans-serif;
    margin-top: 1px;
    line-height: 1;
    text-transform: uppercase;
  }

  .topbar-right-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .profile-circle-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--abu);
    background: var(--abu-tua);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .profile-circle-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
  }

  .profile-circle-btn svg, .profile-circle-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-circle-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--abu-terang);
    padding: 2px;
  }

  .profile-dropdown-menu {
    position: absolute;
    top: 44px;
    right: 0;
    width: 170px;
    background: rgba(13, 13, 13, 0.96);
    border: 1.5px solid var(--abu-terang);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    padding: 6px;
    z-index: 999;
    backdrop-filter: blur(10px);
    
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.96);
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                visibility 0.25s;
  }

  .profile-dropdown-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    color: var(--abu-terang);
    text-decoration: none;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    background: none;
    border: none;
    text-align: left;
    width: 100%;
  }

  .dropdown-item:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  /* MAIN SCREEN */
  #screen-penagihan{
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 64px;
    padding-bottom: 80px;
    overflow-y: auto;
  }

  .section-wrap {
    width: 92%;
    max-width: 360px;
    margin-bottom: 14px;
  }

  .section-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    color: var(--abu-terang);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* DASHBOARD / METODE PEMBAYARAN CARD */
  .health-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0d0d0d, #1c1c1c);
    border: 2px solid var(--abu);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }

  .health-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .health-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .metode-list-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 160px;
    overflow-y: auto;
  }

  .metode-card-row {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .metode-info-text {
    font-size: 0.75rem;
    color: #ddd;
    line-height: 1.3;
  }

  .metode-info-text b {
    color: var(--biru);
  }

  .metode-qris-img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #444;
  }

  .metode-empty {
    font-size: 0.75rem;
    color: #666;
    text-align: center;
    padding: 10px 0;
  }

  /* LIST TAGIHAN */
  .tagihan-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tagihan-empty {
    text-align: center;
    color: #666;
    font-size: 0.8rem;
    padding: 24px 10px;
    border: 1.5px dashed #333;
    border-radius: 12px;
  }

  .tagihan-card-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.85);
    border: 1.5px solid #333;
    border-radius: 12px;
    padding: 12px 14px;
  }

  .tagihan-item-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .tagihan-nama {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    color: #f0f0f0;
  }

  .tagihan-detail {
    font-size: 0.7rem;
    color: #888;
  }

  .tagihan-amount {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    color: var(--biru);
    text-align: right;
  }

  .tagihan-status {
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 2px;
  }
  .tagihan-status.lunas { background: rgba(74,222,128,0.15); color: var(--hijau); border: 1px solid var(--hijau); }
  .tagihan-status.belum { background: rgba(255,107,107,0.15); color: var(--merah); border: 1px solid var(--merah); }

  /* FLOATING ADD BUTTON */
  .fab-add-btn {
    position: fixed;
    bottom: 78px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--abu-terang);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 40;
    transition: transform 0.2s;
  }

  .fab-add-btn:active {
    transform: scale(0.9);
  }

  .fab-add-btn svg {
    width: 26px;
    height: 26px;
    fill: #000;
  }

  /* POPUP / MODAL */
  .popupBox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    padding: 20px;
  }

  .popupBox.active {
    display: flex;
  }

  .popupContent {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 340px;
    background: #000;
    border: 2px solid var(--abu-terang);
    border-radius: 20px;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .popupContent h2 {
    margin-top: 0;
    margin-bottom: 14px;
    font-family: 'FiraCondBold', sans-serif;
    color: var(--abu-terang);
    text-align: center;
    font-size: 1.1rem;
  }

  .form-label {
    font-size: 0.72rem;
    color: #999;
    font-family: 'FiraCondBold', sans-serif;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-input {
    width: 100%;
    height: 44px;
    background: #0d0d0d;
    border: 1px solid var(--abu);
    border-radius: 10px;
    color: #fff;
    padding: 0 12px;
    font-family: 'FiraCondBook', sans-serif;
    font-size: 0.95rem;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .form-input:focus {
    border-color: var(--abu-terang);
  }

  /* CUSTOM UPLOAD BOX STYLING */
  .qris-upload-box {
    width: 100%;
    height: 130px;
    border: 2px dashed var(--abu);
    border-radius: 12px;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    transition: border-color 0.2s;
  }

  .qris-upload-box:hover {
    border-color: var(--biru);
  }

  .qris-upload-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .qris-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #aaa;
    font-size: 0.75rem;
    font-family: 'FiraCondBold', sans-serif;
  }

  .qris-placeholder svg {
    width: 24px;
    height: 24px;
    fill: var(--biru);
  }

  /* CUSTOM DROPDOWN SELECTOR MODAL */
  .custom-select-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
    max-height: 220px;
    overflow-y: auto;
  }

  .custom-option-btn {
    width: 100%;
    background: #111;
    border: 1.5px solid var(--abu);
    color: #fff;
    padding: 12px;
    border-radius: 10px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }

  .custom-option-btn:hover, .custom-option-btn.selected {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--biru);
    color: var(--biru);
  }

  .modal-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    text-align: center;
  }

  .modal-btn.simpan {
    background: var(--abu-terang);
    color: #000;
  }

  .modal-btn.batal {
    background: #1a1a1a;
    border: 1.5px solid #444;
    color: #aaa;
  }

  /* CUSTOM ALERT BOX */
  .custom-modal-box {
    background: #0d0d0d;
    border: 2px solid var(--abu-terang);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .custom-modal-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 1.1rem;
    color: var(--abu-terang);
    margin-bottom: 8px;
  }

  .custom-modal-msg {
    font-size: 0.9rem;
    color: #ddd;
    margin-bottom: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .custom-modal-buttons {
    display: flex;
    gap: 8px;
  }

  .custom-modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
  }

  .custom-modal-btn.primary {
    background: var(--abu-terang);
    color: #000;
  }

  .custom-modal-btn.secondary {
    background: #222;
    color: #aaa;
    border: 1px solid #444;
  }

  /* BOTTOM NAVBAR */
  .mbanking-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: rgba(0, 0, 0, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    z-index: 99999;
    backdrop-filter: blur(8px);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #888;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.55rem;
    gap: 3px;
    padding: 4px 2px;
    transition: color 0.2s;
    cursor: pointer;
    background: none;
    border: none;
    min-width: 0;
  }

  .nav-item span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .nav-item.active, .nav-item:hover {
    color: var(--abu-terang);
  }
</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- TOP BAR -->
  <div class="mbanking-topbar">
    <div class="mbanking-brand-container">
      <div class="mbanking-brand">Kost<span>ku</span></div>
      <div class="mbanking-greeting-top">Penagihan</div>
    </div>
    
    <div class="topbar-right-wrap">
      <div class="profile-circle-btn" id="topProfileBtn" onclick="toggleProfileDropdown(event)" title="Menu Profil">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>

      <div class="profile-dropdown-menu" id="profileDropdownMenu">
        <button type="button" class="dropdown-item" onclick="window.location.href='profile.html'">
          👤 Kunjungi Profil
        </button>
        <button type="button" class="dropdown-item" onclick="window.location.href='pengaturan.html'">
          ⚙️ Pengaturan
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="screen-penagihan">

    <!-- DASHBOARD METODE PEMBAYARAN -->
    <div class="section-wrap">
      <div class="health-card">
        <div class="health-header">
          <div class="health-title">Metode Pembayaran Tersimpan</div>
        </div>
        <div class="metode-list-container" id="metodeListContainer"></div>
      </div>
    </div>

    <!-- DAFTAR TAGIHAN -->
    <div class="section-wrap">
      <div class="section-title">
        <span>Daftar Tagihan Piutang</span>
      </div>
      <div class="tagihan-list" id="tagihanListContainer"></div>
    </div>

  </div>

  <!-- FLOATING ADD BUTTON -->
  <button class="fab-add-btn" id="fabAddBtn" onclick="openAddMetodePopup()" title="Tambah Metode Pembayaran">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <!-- BOTTOM NAVBAR -->
  <nav class="mbanking-bottom-nav" id="bottomNav"></nav>

  <!-- POPUP TAMBAH METODE PEMBAYARAN -->
  <div id="addMetodePopup" class="popupBox">
    <div class="popupContent">
      <h2>Tambah Metode</h2>

      <div class="form-group">
        <label class="form-label">Tipe Metode</label>
        <div class="form-input" id="displayTipeMetode" onclick="openSelectTipePopup()">
          <span id="selectedTipeText">Transfer Bank</span>
          <svg style="width:16px; height:16px; fill:#888;" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
      </div>

      <!-- PILIHAN NAMA BANK ATAU E-WALLET (BAKU / LIST RESMI) -->
      <div class="form-group" id="groupNamaProvider">
        <label class="form-label" id="labelProviderName">Pilih Bank</label>
        <div class="form-input" id="displayNamaProvider" onclick="openSelectProviderPopup()">
          <span id="selectedProviderText">BCA</span>
          <svg style="width:16px; height:16px; fill:#888;" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
      </div>

      <div class="form-group" id="groupNomorAkun">
        <label class="form-label" id="labelNomorAkun">Nomor Rekening</label>
        <input type="text" class="form-input" id="inputNomorAkun" placeholder="Contoh: 1234567890" style="cursor:text;">
      </div>

      <div class="form-group" id="groupAtasNama">
        <label class="form-label">Atas Nama Pemilik Rekening</label>
        <input type="text" class="form-input" id="inputAtasNama" placeholder="Contoh: Budi Santoso" style="cursor:text;">
      </div>

      <div class="form-group" id="groupQrisUpload" style="display:none;">
        <label class="form-label">Upload QRIS (Crop 1:1)</label>
        <div class="qris-upload-box" onclick="document.getElementById('hiddenFileInput').click()">
          <div class="qris-placeholder" id="qrisPlaceholder">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg>
            <span>Ketuk untuk Pilih Gambar</span>
          </div>
          <img id="qrisPreviewImg" style="display:none;" alt="Preview QRIS">
        </div>
        <input type="file" id="hiddenFileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)">
      </div>

      <div class="modal-btn-row">
        <button type="button" class="modal-btn batal" onclick="closeAddMetodePopup()">Batal</button>
        <button type="button" class="modal-btn simpan" onclick="simpanMetodePembayaran()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- POPUP PILIH TIPE METODE -->
  <div id="selectTipePopup" class="popupBox">
    <div class="popupContent" style="max-width: 300px;">
      <h2>Pilih Tipe Metode</h2>
      <div class="custom-select-options">
        <button type="button" class="custom-option-btn" onclick="pilihTipeMetode('Bank')">Transfer Bank</button>
        <button type="button" class="custom-option-btn" onclick="pilihTipeMetode('E-Wallet')">E-Wallet</button>
        <button type="button" class="custom-option-btn" onclick="pilihTipeMetode('QRIS')">QRIS</button>
      </div>
      <button type="button" class="modal-btn batal" style="margin-top: 12px;" onclick="closeSelectTipePopup()">Batal</button>
    </div>
  </div>

  <!-- POPUP PILIH NAMA BANK / E-WALLET (BAKU) -->
  <div id="selectProviderPopup" class="popupBox">
    <div class="popupContent" style="max-width: 300px;">
      <h2 id="providerPopupTitle">Pilih Bank</h2>
      <div class="custom-select-options" id="providerOptionsContainer"></div>
      <button type="button" class="modal-btn batal" style="margin-top: 12px;" onclick="closeSelectProviderPopup()">Batal</button>
    </div>
  </div>

  <!-- CUSTOM ALERT MODAL -->
  <div id="customModalOverlay" class="popupBox">
    <div class="custom-modal-box">
      <div class="custom-modal-title" id="customModalTitle">Informasi</div>
      <div class="custom-modal-msg" id="customModalMsg">Pesan...</div>
      <div class="custom-modal-buttons" id="customModalBtnContainer">
        <button type="button" class="custom-modal-btn primary" id="customModalOkBtn" onclick="closeCustomModal(true)">OK</button>
        <button type="button" class="custom-modal-btn secondary" id="customModalCancelBtn" onclick="closeCustomModal(false)" style="display:none;">Batal</button>
      </div>
    </div>
  </div>

  <script>
    let modalCallback = null;
    let selectedTipeValue = "Bank";
    let selectedProviderValue = "BCA";
    let croppedQrisDataUrl = "";

    const listBanks = ["BCA", "Mandiri", "BNI", "BRI", "BSI", "CIMB Niaga", "Permata Bank", "Bank Jago", "SeaBank"];
    const listEwallets = ["DANA", "GoPay", "OVO", "ShopeePay", "LinkAja"];

    function showCustomAlert(message, title = "Informasi") {
      return new Promise((resolve) => {
        document.getElementById("customModalTitle").innerText = title;
        document.getElementById("customModalMsg").innerText = message;
        document.getElementById("customModalCancelBtn").style.display = "none";
        document.getElementById("customModalOverlay").classList.add("active");
        modalCallback = (res) => resolve(res);
      });
    }

    function closeCustomModal(result) {
      document.getElementById("customModalOverlay").classList.remove("active");
      if(modalCallback) {
        modalCallback(result);
        modalCallback = null;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedPic = localStorage.getItem("profile_picture") || localStorage.getItem("user_avatar");
      if(savedPic) {
        const topBtn = document.getElementById("topProfileBtn");
        topBtn.innerHTML = `<img src="${savedPic}" alt="Profile">`;
      }
      renderPenagihanPage();
    });

    function toggleProfileDropdown(event) {
      event.stopPropagation();
      const menu = document.getElementById("profileDropdownMenu");
      menu.classList.toggle("active");
    }

    window.addEventListener("click", () => {
      const menu = document.getElementById("profileDropdownMenu");
      if (menu.classList.contains("active")) {
        menu.classList.remove("active");
      }
    });

    function openPengaturanPage() {
      showCustomAlert("Halaman Pengaturan segera hadir!", "Pengaturan");
    }

    const STORAGE_KEY_METODE = "kostku_metode_pembayaran";
    const STORAGE_KEY_PIUTANG = "kostku_data_piutang";

    function getMetodeList() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_METODE);
        return raw ? JSON.parse(raw) : [];
      } catch(e) {
        return [];
      }
    }

    function saveMetodeList(list) {
      localStorage.setItem(STORAGE_KEY_METODE, JSON.stringify(list));
      syncPenagihanTextForTagih(list);
    }

    function syncPenagihanTextForTagih(list) {
      if (list.length === 0) {
        localStorage.setItem("kostku_penagihan", "");
        return;
      }
      let text = list.map(m => {
        if (m.tipe === 'QRIS') {
          return `- QRIS`;
        } else {
          return `- ${m.tipe} (${m.namaProvider}) | ${m.nomorAkun} a.n ${m.atasNama}`;
        }
      }).join("\n");
      localStorage.setItem("kostku_penagihan", text);
    }

    function openAddMetodePopup() {
      selectedTipeValue = "Bank";
      selectedProviderValue = "BCA";
      document.getElementById("selectedTipeText").innerText = "Transfer Bank";
      document.getElementById("selectedProviderText").innerText = "BCA";
      document.getElementById("inputNomorAkun").value = "";
      document.getElementById("inputAtasNama").value = "";
      document.getElementById("hiddenFileInput").value = "";
      document.getElementById("qrisPreviewImg").style.display = "none";
      document.getElementById("qrisPlaceholder").style.display = "flex";
      croppedQrisDataUrl = "";
      handleTipeChange();
      document.getElementById("addMetodePopup").classList.add("active");
    }

    function closeAddMetodePopup() {
      document.getElementById("addMetodePopup").classList.remove("active");
    }

    function openSelectTipePopup() {
      document.getElementById("selectTipePopup").classList.add("active");
    }

    function closeSelectTipePopup() {
      document.getElementById("selectTipePopup").classList.remove("active");
    }

    function openSelectProviderPopup() {
      const container = document.getElementById("providerOptionsContainer");
      const title = document.getElementById("providerPopupTitle");
      const items = selectedTipeValue === 'Bank' ? listBanks : listEwallets;

      title.innerText = selectedTipeValue === 'Bank' ? "Pilih Bank" : "Pilih E-Wallet";
      container.innerHTML = items.map(item => `
        <button type="button" class="custom-option-btn" onclick="pilihProviderItem('${item}')">${item}</button>
      `).join("");

      document.getElementById("selectProviderPopup").classList.add("active");
    }

    function closeSelectProviderPopup() {
      document.getElementById("selectProviderPopup").classList.remove("active");
    }

    function pilihProviderItem(prov) {
      selectedProviderValue = prov;
      document.getElementById("selectedProviderText").innerText = prov;
      closeSelectProviderPopup();
    }

    function pilihTipeMetode(tipe) {
      selectedTipeValue = tipe;
      let label = "Transfer Bank";
      if (tipe === 'E-Wallet') {
        label = "E-Wallet";
        selectedProviderValue = "DANA";
      } else if (tipe === 'Bank') {
        selectedProviderValue = "BCA";
      }

      document.getElementById("selectedTipeText").innerText = label;
      document.getElementById("selectedProviderText").innerText = selectedProviderValue;
      closeSelectTipePopup();
      handleTipeChange();
    }

    function handleTipeChange() {
      const groupProvider = document.getElementById("groupNamaProvider");
      const groupNomor = document.getElementById("groupNomorAkun");
      const labelNomor = document.getElementById("labelNomorAkun");
      const groupAtasNama = document.getElementById("groupAtasNama");
      const groupQris = document.getElementById("groupQrisUpload");
      const labelProviderName = document.getElementById("labelProviderName");

      if (selectedTipeValue === 'QRIS') {
        groupProvider.style.display = "none";
        groupNomor.style.display = "none";
        groupAtasNama.style.display = "none";
        groupQris.style.display = "block";
      } else {
        groupProvider.style.display = "block";
        groupNomor.style.display = "block";
        groupAtasNama.style.display = "block";
        groupQris.style.display = "none";

        if (selectedTipeValue === 'Bank') {
          labelProviderName.innerText = "Pilih Bank";
          labelNomor.innerText = "Nomor Rekening";
        } else {
          labelProviderName.innerText = "Pilih E-Wallet";
          labelNomor.innerText = "Nomor HP / Akun";
        }
      }
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          const size = Math.min(img.width, img.height);
          canvas.width = size;
          canvas.height = size;

          const offsetX = (img.width - size) / 2;
          const offsetY = (img.height - size) / 2;

          ctx.drawImage(img, offsetX, offsetY, size, size, 0, 0, size, size);

          croppedQrisDataUrl = canvas.toDataURL("image/jpeg", 0.9);

          const previewImg = document.getElementById("qrisPreviewImg");
          previewImg.src = croppedQrisDataUrl;
          previewImg.style.display = "block";
          document.getElementById("qrisPlaceholder").style.display = "none";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function simpanMetodePembayaran() {
      let list = getMetodeList();

      if (selectedTipeValue === 'QRIS') {
        if (!croppedQrisDataUrl) {
          await showCustomAlert("Silakan upload gambar QRIS terlebih dahulu!", "Kesalahan");
          return;
        }
        list.push({
          id: "m_" + Date.now(),
          tipe: "QRIS",
          namaProvider: "QRIS",
          nomorAkun: "",
          atasNama: "",
          qrisImg: croppedQrisDataUrl
        });
      } else {
        const nomorAkun = document.getElementById("inputNomorAkun").value.trim();
        const atasNama = document.getElementById("inputAtasNama").value.trim();

        if (!nomorAkun || !atasNama) {
          await showCustomAlert("Nomor dan Atas Nama wajib diisi!", "Kesalahan");
          return;
        }

        list.push({
          id: "m_" + Date.now(),
          tipe: selectedTipeValue,
          namaProvider: selectedProviderValue,
          nomorAkun: nomorAkun,
          atasNama: atasNama,
          qrisImg: ""
        });
      }

      saveMetodeList(list);
      closeAddMetodePopup();
      renderPenagihanPage();
    }

    function formatIDR(num) {
      num = Math.round(num);
      return "Rp " + num.toLocaleString('id-ID');
    }

    function renderPenagihanPage() {
      const metodeList = getMetodeList();
      const metodeContainer = document.getElementById("metodeListContainer");

      if (metodeList.length === 0) {
        metodeContainer.innerHTML = `<div class="metode-empty">Belum ada metode pembayaran. Klik tombol (+) untuk menambah.</div>`;
      } else {
        metodeContainer.innerHTML = metodeList.map(m => {
          if (m.tipe === 'QRIS') {
            return `
              <div class="metode-card-row">
                <div class="metode-info-text"><b>QRIS</b><br>Scan untuk pembayaran</div>
                ${m.qrisImg ? `<img src="${m.qrisImg}" class="metode-qris-img" alt="QRIS">` : ''}
              </div>
            `;
          } else {
            return `
              <div class="metode-card-row">
                <div class="metode-info-text"><b>${m.tipe} - ${m.namaProvider}</b><br>No: <b>${m.nomorAkun}</b> (${m.atasNama})</div>
              </div>
            `;
          }
        }).join("");
      }

      let piutangList = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY_PIUTANG);
        piutangList = raw ? JSON.parse(raw) : [];
      } catch(e) {
        piutangList = [];
      }

      const tagihanContainer = document.getElementById("tagihanListContainer");
      if (piutangList.length === 0) {
        tagihanContainer.innerHTML = `<div class="tagihan-empty">Belum ada daftar tagihan piutang dari menu Utangin Orang.</div>`;
        return;
      }

      tagihanContainer.innerHTML = piutangList.map(item => {
        const isLunas = item.status === 'lunas';
        return `
          <div class="tagihan-card-item">
            <div class="tagihan-item-left">
              <div class="tagihan-nama">${item.nama}</div>
              <div class="tagihan-detail">${item.catatan ? item.catatan : 'Tanpa catatan'} (${item.tanggal})</div>
              <div><span class="tagihan-status ${isLunas ? 'lunas' : 'belum'}">${isLunas ? 'Lunas' : 'Belum Lunas'}</span></div>
            </div>
            <div class="tagihan-amount">${formatIDR(item.nominal)}</div>
          </div>
        `;
      }).join("");
    }

    const navItems = [
      { href: "index.html",          label: "Home",
        svg: `<path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3l9-8z"/>` },
      { href: "kelola-uang.html",    label: "Uang",
        svg: `<path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>` },
      { href: "utang.html",          label: "Utang",
        svg: `<path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>` },
      { href: "rekap.html",          label: "Rekap",
        svg: `<path d="M3 3v18h18V3H3zm4 14H5v-4h2v4zm4 0h-2V9h2v8zm4 0h-2v-6h2v6zm4 0h-2V7h2v10z"/>` },
      { href: "penagihan.html",      label: "Penagihan", active: true,
        svg: `<path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>` },
      { href: "profile.html",        label: "Profil",
        svg: `<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>` }
    ];

    function renderBottomNav() {
      const nav = document.getElementById("bottomNav");
      nav.innerHTML = navItems.map(item => `
        <a href="${item.href}" class="nav-item ${item.active ? 'active' : ''}">
          <svg viewBox="0 0 24 24">${item.svg}</svg>
          <span>${item.label}</span>
        </a>
      `).join("");
    }

    renderBottomNav();
  </script>

</body>
</html>
