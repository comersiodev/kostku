<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catatan - Kostku</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Kostku siap offline!"))
      .catch(err => console.log("Gagal daftar sw:", err));
  }
</script>

<style>
  @font-face{
    font-family: 'OswaldBold';
    src: url('oswald-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBold';
    src: url('firasanscondensed-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBook';
    src: url('firasanscondensed-book.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
  }

  :root{
    --abu: #888888;
    --abu-terang: #cccccc;
    --abu-tua: #1a1a1a;
    --gelap: #000000;
    --hijau: #4ade80;
    --kuning: #ffd166;
    --merah: #ff6b6b;
    --biru: #38bdf8;
    --whatsapp: #25d366;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'FiraCondBook', sans-serif;
  }

  body{
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000000;
  }

  .bg-layer{
    position: fixed;
    inset: 0;
    background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjuCYRrpK_F7zIPk0QFsm4YqWoP3VZXyYORohocnvBauwuJc69m9Zqf9l4l080KOOrkP1C5Lc2AD94oE8o6fnbUf_lNziQKSW9VjrcOko3Y4lA6Q43XXqeoEJn6Do1h0JWVC7MQREoHPcxZ8K1WRm1ouayuhxKpKTTtB7W6jVPYQL2lFX6_O9izv360q7PA/s1376/1788971700934.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg-dim{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1;
  }

  /* TOP BAR */
  .mbanking-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(0, 0, 0, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .mbanking-brand-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .mbanking-brand {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.1rem;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .mbanking-brand span {
    color: var(--abu-terang);
  }

  .mbanking-greeting-top {
    font-size: 0.7rem;
    color: var(--abu-terang);
    font-family: 'FiraCondBold', sans-serif;
    margin-top: 1px;
    line-height: 1;
    text-transform: uppercase;
  }

  .topbar-right-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .profile-circle-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--abu);
    background: var(--abu-tua);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .profile-circle-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
  }

  .profile-circle-btn svg, .profile-circle-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-circle-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--abu-terang);
    padding: 2px;
  }

  .profile-dropdown-menu {
    position: absolute;
    top: 44px;
    right: 0;
    width: 170px;
    background: rgba(13, 13, 13, 0.96);
    border: 1.5px solid var(--abu-terang);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    padding: 6px;
    z-index: 999;
    backdrop-filter: blur(10px);
    
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.96);
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                visibility 0.25s;
  }

  .profile-dropdown-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    color: var(--abu-terang);
    text-decoration: none;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    background: none;
    border: none;
    text-align: left;
    width: 100%;
  }

  .dropdown-item:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  /* MAIN SCREEN */
  #screen-catatan{
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 64px;
    padding-bottom: 80px;
    overflow-y: auto;
  }

  .section-wrap {
    width: 92%;
    max-width: 360px;
    margin-bottom: 14px;
  }

  .section-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    color: var(--abu-terang);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* WIDGET CATATAN TERSEMAT */
  .pinned-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0d0d0d, #1c1c1c);
    border: 2px solid var(--kuning);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }

  .pinned-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .pinned-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem;
    color: var(--kuning);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pinned-content-text {
    font-size: 0.8rem;
    color: #ddd;
    line-height: 1.4;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* DAFTAR CARD CATATAN */
  .catatan-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .catatan-empty {
    text-align: center;
    color: #666;
    font-size: 0.8rem;
    padding: 24px 10px;
    border: 1.5px dashed #333;
    border-radius: 12px;
  }

  .catatan-card-item {
    background: rgba(0,0,0,0.85);
    border: 1.5px solid #333;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }

  .catatan-card-item:active {
    transform: scale(0.98);
  }

  .catatan-card-item:hover {
    border-color: var(--abu-terang);
  }

  .catatan-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .catatan-card-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    color: #f0f0f0;
  }

  .catatan-card-date {
    font-size: 0.65rem;
    color: #888;
  }

  .catatan-card-snippet {
    font-size: 0.75rem;
    color: #bbb;
    line-height: 1.3;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .pin-badge {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 0.6rem;
    background: rgba(255, 209, 102, 0.15);
    color: var(--kuning);
    border: 1px solid var(--kuning);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'FiraCondBold', sans-serif;
  }

  /* FLOATING MORPHING PEN BUTTON */
  .fab-pen-btn {
    position: fixed;
    bottom: 78px;
    right: 20px;
    height: 56px;
    width: 56px;
    border-radius: 28px;
    background: var(--abu-terang);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 40;
    overflow: hidden;
    transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
    user-select: none;
    -webkit-user-select: none;
  }

  .fab-pen-btn.expanded {
    width: 155px;
    background: #ffffff;
  }

  .fab-pen-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 0 16px;
    white-space: nowrap;
  }

  .fab-pen-btn svg {
    width: 24px;
    height: 24px;
    fill: #000;
    flex-shrink: 0;
  }

  .fab-pen-text {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    color: #000;
    opacity: 0;
    transition: opacity 0.2s ease;
    display: none;
  }

  .fab-pen-btn.expanded .fab-pen-text {
    opacity: 1;
    display: inline;
  }

  /* POPUP / MODAL */
  .popupBox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    padding: 20px;
  }

  .popupBox.active {
    display: flex;
  }

  .popupContent {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 340px;
    background: #000;
    border: 2px solid var(--abu-terang);
    border-radius: 20px;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .popupContent h2 {
    margin-top: 0;
    margin-bottom: 14px;
    font-family: 'FiraCondBold', sans-serif;
    color: var(--abu-terang);
    text-align: center;
    font-size: 1.1rem;
  }

  .form-label {
    font-size: 0.72rem;
    color: #999;
    font-family: 'FiraCondBold', sans-serif;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-input {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid var(--abu);
    border-radius: 10px;
    color: #fff;
    padding: 10px 12px;
    font-family: 'FiraCondBook', sans-serif;
    font-size: 0.95rem;
    outline: none;
    resize: vertical;
  }

  .form-input:focus {
    border-color: var(--abu-terang);
  }

  /* Khusus textarea isi catatan biar leluasa bikin baris baru pakai enter */
  textarea.form-input {
    height: 120px;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #ddd;
    cursor: pointer;
    margin-bottom: 14px;
    font-family: 'FiraCondBold', sans-serif;
  }

  .checkbox-group input {
    width: 16px;
    height: 16px;
    accent-color: var(--abu-terang);
    cursor: pointer;
  }

  .modal-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    text-align: center;
  }

  .modal-btn.simpan {
    background: var(--abu-terang);
    color: #000;
  }

  .modal-btn.batal {
    background: #1a1a1a;
    border: 1.5px solid #444;
    color: #aaa;
  }

  /* DETAIL / OPSI AKSI CARD MODAL */
  .detail-catatan-box {
    background: #0d0d0d;
    border: 1.5px solid #333;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: #ddd;
    line-height: 1.4;
    max-height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  .action-opt-btn {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    border: none;
    text-align: center;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .action-opt-btn.whatsapp {
    background: rgba(37, 211, 102, 0.15);
    color: var(--whatsapp);
    border: 1px solid var(--whatsapp);
  }

  .action-opt-btn.whatsapp svg {
    width: 18px;
    height: 18px;
    fill: var(--whatsapp);
  }

  .action-opt-btn.edit {
    background: rgba(56, 189, 248, 0.15);
    color: var(--biru);
    border: 1px solid var(--biru);
  }

  .action-opt-btn.hapus {
    background: rgba(255, 107, 107, 0.15);
    color: var(--merah);
    border: 1px solid var(--merah);
  }

  /* CUSTOM ALERT BOX */
  .custom-modal-box {
    background: #0d0d0d;
    border: 2px solid var(--abu-terang);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .custom-modal-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 1.1rem;
    color: var(--abu-terang);
    margin-bottom: 8px;
  }

  .custom-modal-msg {
    font-size: 0.9rem;
    color: #ddd;
    margin-bottom: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .custom-modal-buttons {
    display: flex;
    gap: 8px;
  }

  .custom-modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
  }

  .custom-modal-btn.primary {
    background: var(--abu-terang);
    color: #000;
  }

  .custom-modal-btn.secondary {
    background: #222;
    color: #aaa;
    border: 1px solid #444;
  }

  /* BOTTOM NAVBAR */
  .mbanking-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: rgba(0, 0, 0, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    z-index: 99999;
    backdrop-filter: blur(8px);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #888;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.55rem;
    gap: 3px;
    padding: 4px 2px;
    transition: color 0.2s;
    cursor: pointer;
    background: none;
    border: none;
    min-width: 0;
  }

  .nav-item span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .nav-item.active, .nav-item:hover {
    color: var(--abu-terang);
  }
</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- TOP BAR -->
  <div class="mbanking-topbar">
    <div class="mbanking-brand-container">
      <div class="mbanking-brand">Kost<span>ku</span></div>
      <div class="mbanking-greeting-top">Catatan</div>
    </div>
    
    <div class="topbar-right-wrap">
      <div class="profile-circle-btn" id="topProfileBtn" onclick="toggleProfileDropdown(event)" title="Menu Profil">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>

      <div class="profile-dropdown-menu" id="profileDropdownMenu">
        <button type="button" class="dropdown-item" onclick="window.location.href='profile.html'">
          👤 Kunjungi Profil
        </button>
        <button type="button" class="dropdown-item" onclick="openPengaturanPage()">
          ⚙️ Pengaturan
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="screen-catatan">

    <!-- WIDGET CATATAN TERSEMAT -->
    <div class="section-wrap" id="pinnedSection" style="display:none;">
      <div class="pinned-card" id="pinnedCardWidget">
        <div class="pinned-header">
          <div class="pinned-title">
            <svg style="width:14px;height:14px;fill:var(--kuning);" viewBox="0 0 24 24"><path d="M16 12V4H17V2H7V4H8V12L6 14V16H11.2V22H12.8V16H18V14L16 12Z"/></svg>
            Catatan Tersemat
          </div>
        </div>
        <div class="pinned-content-text" id="pinnedWidgetText">-</div>
      </div>
    </div>

    <!-- DAFTAR CATATAN -->
    <div class="section-wrap">
      <div class="section-title">
        <span>Semua Catatan</span>
      </div>
      <div class="catatan-list" id="catatanListContainer"></div>
    </div>

  </div>

  <!-- FLOATING MORPHING PEN BUTTON -->
  <button class="fab-pen-btn" id="fabPenBtn" title="Tulis Catatan">
    <div class="fab-pen-content">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span class="fab-pen-text">Mulai menulis?</span>
    </div>
  </button>

  <!-- BOTTOM NAVBAR -->
  <nav class="mbanking-bottom-nav" id="bottomNav"></nav>

  <!-- POPUP TAMBAH / EDIT CATATAN -->
  <div id="catatanPopup" class="popupBox">
    <div class="popupContent">
      <h2 id="catatanPopupTitle">Tulis Catatan Baru</h2>
      <input type="hidden" id="editCatatanId" value="">

      <div class="form-group">
        <label class="form-label">Judul Catatan</label>
        <textarea class="form-input" id="inputJudulCatatan" placeholder="Contoh: Belanja Bulanan" style="height: 44px; resize: none;"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Isi Catatan</label>
        <textarea class="form-input" id="inputIsiCatatan" placeholder="Tulis catatan di sini... (Enter = baris baru)"></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="inputPinCatatan">
        <label for="inputPinCatatan" style="cursor:pointer;">Sematkan catatan ini (Pinned)</label>
      </div>

      <div class="modal-btn-row">
        <button type="button" class="modal-btn batal" onclick="closeCatatanPopup()">Batal</button>
        <button type="button" class="modal-btn simpan" onclick="simpanCatatan()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- POPUP AKSI CARD (DETAIL, WA, EDIT, HAPUS) -->
  <div id="aksiCatatanPopup" class="popupBox">
    <div class="popupContent">
      <h2 id="aksiPopupTitle">Judul Catatan</h2>
      <div class="detail-catatan-box" id="aksiPopupIsi">Isi catatan...</div>
      
      <button type="button" class="action-opt-btn whatsapp" onclick="kirimKeWhatsApp()">
        <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m0 1.83c2.16 0 4.19.84 5.72 2.36 1.53 1.53 2.37 3.56 2.37 5.72 0 4.46-3.63 8.09-8.09 8.09-1.42 0-2.82-.38-4.04-1.1l-.29-.17-3.03.79.81-2.95-.19-.31A8.03 8.03 0 0 1 3.95 11.9c0-4.46 3.63-8.07 8.09-8.07m4.94 10.3c-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.61.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.59.07-.27-.14-1.13-.42-2.15-1.33-.79-.7-1.33-1.57-1.49-1.84-.16-.27-.02-.42.12-.56.12-.12.27-.32.41-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.02-.22-.53-.45-.46-.61-.47h-.52c-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.3 0 1.36.99 2.67 1.13 2.85.14.18 1.95 2.98 4.73 4.18.66.28 1.17.45 1.57.58.66.21 1.26.18 1.73.11.53-.08 1.6-.65 1.83-1.28.23-.63.23-1.17.16-1.28-.07-.11-.25-.18-.52-.32z"/></svg>
        Kirimkan ke WhatsApp
      </button>

      <button type="button" class="action-opt-btn edit" onclick="bukaEditDariAksi()">
        ✏️ Edit Catatan
      </button>

      <button type="button" class="action-opt-btn hapus" onclick="hapusCatatanDariAksi()">
        🗑️ Hapus Catatan
      </button>

      <button type="button" class="modal-btn batal" style="margin-top: 6px;" onclick="closeAksiCatatanPopup()">Tutup</button>
    </div>
  </div>

  <!-- CUSTOM ALERT MODAL -->
  <div id="customModalOverlay" class="popupBox">
    <div class="custom-modal-box">
      <div class="custom-modal-title" id="customModalTitle">Informasi</div>
      <div class="custom-modal-msg" id="customModalMsg">Pesan...</div>
      <div class="custom-modal-buttons" id="customModalBtnContainer">
        <button type="button" class="custom-modal-btn primary" id="customModalOkBtn" onclick="closeCustomModal(true)">OK</button>
        <button type="button" class="custom-modal-btn secondary" id="customModalCancelBtn" onclick="closeCustomModal(false)" style="display:none;">Batal</button>
      </div>
    </div>
  </div>

  <script>
    let modalCallback = null;

    function showCustomAlert(message, title = "Informasi") {
      return new Promise((resolve) => {
        document.getElementById("customModalTitle").innerText = title;
        document.getElementById("customModalMsg").innerText = message;
        document.getElementById("customModalCancelBtn").style.display = "none";
        document.getElementById("customModalOverlay").classList.add("active");
        modalCallback = (res) => resolve(res);
      });
    }

    function showCustomConfirm(message, title = "Konfirmasi") {
      return new Promise((resolve) => {
        document.getElementById("customModalTitle").innerText = title;
        document.getElementById("customModalMsg").innerText = message;
        document.getElementById("customModalCancelBtn").style.display = "block";
        document.getElementById("customModalOverlay").classList.add("active");
        modalCallback = (res) => resolve(res);
      });
    }

    function closeCustomModal(result) {
      document.getElementById("customModalOverlay").classList.remove("active");
      if(modalCallback) {
        modalCallback(result);
        modalCallback = null;
      }
    }

    const fabBtn = document.getElementById("fabPenBtn");
    let holdTimer = null;

    function startHold(e) {
      holdTimer = setTimeout(() => {
        fabBtn.classList.add("expanded");
      }, 250);
    }

    function endHold(e) {
      clearTimeout(holdTimer);
      if (fabBtn.classList.contains("expanded")) {
        setTimeout(() => {
          fabBtn.classList.remove("expanded");
        }, 300);
      }
      openAddCatatanPopup();
    }

    fabBtn.addEventListener("mousedown", startHold);
    fabBtn.addEventListener("mouseup", endHold);
    fabBtn.addEventListener("touchstart", (e) => { startHold(e); });
    fabBtn.addEventListener("touchend", (e) => { 
      clearTimeout(holdTimer);
      if(fabBtn.classList.contains("expanded")) {
        setTimeout(() => fabBtn.classList.remove("expanded"), 300);
      }
      openAddCatatanPopup();
    });

    window.addEventListener("DOMContentLoaded", () => {
      const savedPic = localStorage.getItem("profile_picture") || localStorage.getItem("user_avatar");
      if(savedPic) {
        const topBtn = document.getElementById("topProfileBtn");
        topBtn.innerHTML = `<img src="${savedPic}" alt="Profile">`;
      }
      renderCatatanPage();
    });

    function toggleProfileDropdown(event) {
      event.stopPropagation();
      const menu = document.getElementById("profileDropdownMenu");
      menu.classList.toggle("active");
    }

    window.addEventListener("click", () => {
      const menu = document.getElementById("profileDropdownMenu");
      if (menu.classList.contains("active")) {
        menu.classList.remove("active");
      }
    });

    function openPengaturanPage() {
      showCustomAlert("Halaman Pengaturan segera hadir!", "Pengaturan");
    }

    const STORAGE_KEY_CATATAN = "kostku_data_catatan";

    function getCatatanList() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CATATAN);
        return raw ? JSON.parse(raw) : [];
      } catch(e) {
        return [];
      }
    }

    function saveCatatanList(list) {
      localStorage.setItem(STORAGE_KEY_CATATAN, JSON.stringify(list));
    }

    function todayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth()+1).padStart(2,'0');
      const d = String(now.getDate()).padStart(2,'0');
      return `${d}/${m}/${y}`;
    }

    function openAddCatatanPopup() {
      document.getElementById("editCatatanId").value = "";
      document.getElementById("catatanPopupTitle").innerText = "Tulis Catatan Baru";
      document.getElementById("inputJudulCatatan").value = "";
      document.getElementById("inputIsiCatatan").value = "";
      document.getElementById("inputPinCatatan").checked = false;
      document.getElementById("catatanPopup").classList.add("active");
    }

    function closeCatatanPopup() {
      document.getElementById("catatanPopup").classList.remove("active");
    }

    function simpanCatatan() {
      const idEdit = document.getElementById("editCatatanId").value;
      const judul = document.getElementById("inputJudulCatatan").value.trim();
      const isi = document.getElementById("inputIsiCatatan").value.trim();
      const isPinned = document.getElementById("inputPinCatatan").checked;

      if (!judul || !isi) {
        showCustomAlert("Judul dan isi catatan wajib diisi!", "Kesalahan");
        return;
      }

      let list = getCatatanList();

      if (isPinned) {
        list = list.map(c => ({ ...c, pinned: false }));
      }

      if (idEdit) {
        list = list.map(c => {
          if (c.id === idEdit) {
            return { ...c, judul: judul, isi: isi, pinned: isPinned };
          }
          return c;
        });
      } else {
        list.unshift({
          id: "c_" + Date.now(),
          judul: judul,
          isi: isi,
          tanggal: todayDateStr(),
          pinned: isPinned
        });
      }

      saveCatatanList(list);
      closeCatatanPopup();
      renderCatatanPage();
    }

    function renderCatatanPage() {
      const list = getCatatanList();
      const pinnedSection = document.getElementById("pinnedSection");
      const pinnedWidgetText = document.getElementById("pinnedWidgetText");
      const container = document.getElementById("catatanListContainer");

      const pinnedItem = list.find(c => c.pinned);
      if (pinnedItem) {
        pinnedSection.style.display = "block";
        pinnedWidgetText.innerHTML = `<b>${pinnedItem.judul}</b><br>${pinnedItem.isi}`;
      } else {
        pinnedSection.style.display = "none";
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="catatan-empty">Belum ada catatan tersimpan. Ketuk tombol pen di bawah untuk mulai menulis.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="catatan-card-item" onclick="openAksiCatatan('${item.id}')">
          ${item.pinned ? `<div class="pin-badge">Tersemat</div>` : ''}
          <div class="catatan-card-header">
            <div class="catatan-card-title">${item.judul}</div>
            <div class="catatan-card-date">${item.tanggal}</div>
          </div>
          <div class="catatan-card-snippet">${item.isi}</div>
        </div>
      `).join("");
    }

    let activeCatatanId = null;

    function openAksiCatatan(id) {
      const list = getCatatanList();
      const item = list.find(c => c.id === id);
      if (!item) return;

      activeCatatanId = id;
      document.getElementById("aksiPopupTitle").innerText = item.judul;
      document.getElementById("aksiPopupIsi").innerText = item.isi;
      document.getElementById("aksiCatatanPopup").classList.add("active");
    }

    function closeAksiCatatanPopup() {
      document.getElementById("aksiCatatanPopup").classList.remove("active");
    }

    function kirimKeWhatsApp() {
      const list = getCatatanList();
      const item = list.find(c => c.id === activeCatatanId);
      if (!item) return;

      const textWp = `*${item.judul}*\n(${item.tanggal})\n\n${item.isi}`;
      const encodedUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(textWp)}`;
      window.open(encodedUrl, '_blank');
      closeAksiCatatanPopup();
    }

    function bukaEditDariAksi() {
      const list = getCatatanList();
      const item = list.find(c => c.id === activeCatatanId);
      if (!item) return;

      closeAksiCatatanPopup();
      document.getElementById("editCatatanId").value = item.id;
      document.getElementById("catatanPopupTitle").innerText = "Edit Catatan";
      document.getElementById("inputJudulCatatan").value = item.judul;
      document.getElementById("inputIsiCatatan").value = item.isi;
      document.getElementById("inputPinCatatan").checked = item.pinned || false;
      document.getElementById("catatanPopup").classList.add("active");
    }

    async function hapusCatatanDariAksi() {
      const conf = await showCustomConfirm("Yakin ingin menghapus catatan ini?", "Konfirmasi Hapus");
      if (!conf) return;

      let list = getCatatanList();
      list = list.filter(c => c.id !== activeCatatanId);
      saveCatatanList(list);
      closeAksiCatatanPopup();
      renderCatatanPage();
    }

    const navItems = [
      { href: "index.html",          label: "Home",
        svg: `<path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3l9-8z"/>` },
      { href: "kelola-uang.html",    label: "Uang",
        svg: `<path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>` },
      { href: "catatan.html",        label: "Catatan", active: true,
        svg: `<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>` },
      { href: "rekap.html",          label: "Rekap",
        svg: `<path d="M3 3v18h18V3H3zm4 14H5v-4h2v4zm4 0h-2V9h2v8zm4 0h-2v-6h2v6zm4 0h-2V7h2v10z"/>` },
      { href: "penagihan.html",      label: "Penagihan",
        svg: `<path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>` },
      { href: "profile.html",        label: "Profil",
        svg: `<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>` }
    ];

    function renderBottomNav() {
      const nav = document.getElementById("bottomNav");
      nav.innerHTML = navItems.map(item => `
        <a href="${item.href}" class="nav-item ${item.active ? 'active' : ''}">
          <svg viewBox="0 0 24 24">${item.svg}</svg>
          <span>${item.label}</span>
        </a>
      `).join("");
    }

    renderBottomNav();
  </script>

</body>
</html>
