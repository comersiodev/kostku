<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login - Kostku</title>
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#000000">
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face{ font-family: 'OswaldBold'; src: url('oswald-bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face{ font-family: 'FiraCondBold'; src: url('firasanscondensed-bold.otf') format('opentype'); font-weight: 700; font-style: normal; }
  @font-face{ font-family: 'FiraCondBook'; src: url('firasanscondensed-book.otf') format('opentype'); font-weight: 400; font-style: normal; }

  :root{ --abu: #888888; --abu-terang: #cccccc; --abu-tua: #1a1a1a; --gelap: #000000; --biru: #38bdf8; --hijau: #4ade80; --merah: #ff3b3b; }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'FiraCondBook', sans-serif; background: #000; }

  .bg-layer{
    position: fixed; inset: 0;
    background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjuCYRrpK_F7zIPk0QFsm4YqWoP3VZXyYORohocnvBauwuJc69m9Zqf9l4l080KOOrkP1C5Lc2AD94oE8o6fnbUf_lNziQKSW9VjrcOko3Y4lA6Q43XXqeoEJn6Do1h0JWVC7MQREoHPcxZ8K1WRm1ouayuhxKpKTTtB7W6jVPYQL2lFX6_O9izv360q7PA/s1376/1788971700934.jpg');
    background-size: cover; background-position: center; z-index: 0;
  }
  .bg-dim{ position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1; }

  .login-container {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px; overflow-y: auto;
  }

  .login-card {
    width: 100%; max-width: 340px; background: linear-gradient(135deg, #0d0d0d, #1c1c1c);
    border: 2px solid var(--abu); border-radius: 20px; padding: 24px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 14px;
  }

  .login-brand { font-family: 'OswaldBold', sans-serif; font-size: 1.8rem; color: #fff; margin-bottom: -4px; }
  .login-brand span { color: var(--abu-terang); }
  .login-subtitle { font-size: 0.85rem; color: var(--abu-terang); margin-bottom: 4px; }

  .form-group { text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-family: 'FiraCondBold', sans-serif; font-size: 0.75rem; color: var(--abu-terang); text-transform: uppercase; }
  .form-input {
    width: 100%; background: #000; border: 1px solid var(--abu); border-radius: 8px;
    color: #fff; padding: 10px 12px; font-family: 'FiraCondBook', sans-serif; font-size: 0.9rem; outline: none;
  }
  .form-input:focus { border-color: var(--biru); }

  .btn-submit {
    width: 100%; background: var(--abu-terang); color: #000; border: none; padding: 12px;
    border-radius: 10px; font-family: 'FiraCondBold', sans-serif; font-size: 0.95rem; cursor: pointer;
    transition: background 0.2s; margin-top: 4px;
  }
  .btn-submit:hover { background: #fff; }

  .btn-switch {
    background: transparent; border: none; color: var(--biru); font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem; cursor: pointer; text-decoration: underline; margin-top: -4px;
  }

  .btn-skip {
    background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #aaa; padding: 9px;
    border-radius: 10px; font-family: 'FiraCondBold', sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
  }
  .btn-skip:hover { border-color: var(--abu-terang); color: #fff; }

  /* CUSTOM MODAL POPUP */
  .popupBox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999999; padding: 20px; }
  .popupBox.active { display: flex; }
  .custom-modal-box { background: #0d0d0d; border: 2px solid var(--abu-terang); border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; text-align: center; }
  .custom-modal-title { font-family: 'FiraCondBold', sans-serif; font-size: 1.1rem; color: var(--abu-terang); margin-bottom: 8px; }
  .custom-modal-msg { font-size: 0.9rem; color: #ddd; margin-bottom: 16px; line-height: 1.4; }
  .custom-modal-btn { width: 100%; padding: 10px; border-radius: 8px; font-family: 'FiraCondBold', sans-serif; font-size: 0.9rem; cursor: pointer; border: none; background: var(--abu-terang); color: #000; }
</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <div class="login-container">
    <div class="login-card">
      <div>
        <div class="login-brand">Kost<span>ku</span></div>
        <div class="login-subtitle" id="authModeTitle">Masuk ke Akun Anda</div>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="inputEmail" class="form-input" placeholder="nama@email.com">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="inputPassword" class="form-input" placeholder="Minimal 6 karakter...">
      </div>

      <button type="button" class="btn-submit" id="authSubmitBtn" onclick="handleAuthSubmit()">Masuk</button>
      <button type="button" class="btn-switch" id="authSwitchBtn" onclick="toggleAuthMode()">Belum punya akun? Daftar</button>

      <button type="button" class="btn-skip" onclick="window.location.href='index.html'">Lewati / Lanjutkan Offline</button>
    </div>
  </div>

  <div id="customModalOverlay" class="popupBox">
    <div class="custom-modal-box">
      <div class="custom-modal-title" id="customModalTitle">Informasi</div>
      <div class="custom-modal-msg" id="customModalMsg">Pesan...</div>
      <button type="button" class="custom-modal-btn" onclick="closeCustomModal()">OK</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hdzghpgwciobqharhpjm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NYBzyUfQUny8b38Vj9xXiA_t-W4FItY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isRegisterMode = false;

    function showCustomAlert(message, title = "Informasi") {
      document.getElementById("customModalTitle").innerText = title;
      document.getElementById("customModalMsg").innerText = message;
      document.getElementById("customModalOverlay").classList.add("active");
    }

    function closeCustomModal() {
      document.getElementById("customModalOverlay").classList.remove("active");
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById("authModeTitle").innerText = isRegisterMode ? "Daftar Akun Baru" : "Masuk ke Akun Anda";
      document.getElementById("authSubmitBtn").innerText = isRegisterMode ? "Daftar" : "Masuk";
      document.getElementById("authSwitchBtn").innerText = isRegisterMode ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
    }

    async function handleAuthSubmit() {
      const email = document.getElementById("inputEmail").value.trim();
      const password = document.getElementById("inputPassword").value.trim();

      if (!email || !password) {
        showCustomAlert("Email dan Password tidak boleh kosong!", "Peringatan");
        return;
      }

      try {
        if (isRegisterMode) {
          const { data, error } = await _supabase.auth.signUp({ email, password });
          if (error) throw error;
          showCustomAlert("Pendaftaran berhasil! Silakan masuk.", "Berhasil");
          toggleAuthMode();
        } else {
          const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          localStorage.setItem("google_linked", "true");
          localStorage.setItem("email", data.user.email);
          window.location.href = "index.html";
        }
      } catch (err) {
        showCustomAlert("Gagal: " + err.message, "Kesalahan");
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session && session.user) {
          localStorage.setItem("google_linked", "true");
          localStorage.setItem("email", session.user.email);
          window.location.href = "index.html";
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
