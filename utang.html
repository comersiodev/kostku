<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Utang - Kostku</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Kostku siap offline!"))
      .catch(err => console.log("Gagal daftar sw:", err));
  }
</script>

<style>
  @font-face{
    font-family: 'OswaldBold';
    src: url('oswald-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBold';
    src: url('firasanscondensed-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBook';
    src: url('firasanscondensed-book.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
  }

  :root{
    --abu: #888888;
    --abu-terang: #cccccc;
    --abu-tua: #1a1a1a;
    --gelap: #000000;
    --hijau: #4ade80;
    --kuning: #ffd166;
    --merah: #ff6b6b;
    --oranye: #ff9d5c;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'FiraCondBook', sans-serif;
  }

  body{
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000000;
  }

  .bg-layer{
    position: fixed;
    inset: 0;
    background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjuCYRrpK_F7zIPk0QFsm4YqWoP3VZXyYORohocnvBauwuJc69m9Zqf9l4l080KOOrkP1C5Lc2AD94oE8o6fnbUf_lNziQKSW9VjrcOko3Y4lA6Q43XXqeoEJn6Do1h0JWVC7MQREoHPcxZ8K1WRm1ouayuhxKpKTTtB7W6jVPYQL2lFX6_O9izv360q7PA/s1376/1788971700934.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg-dim{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1;
  }

  /* TOP BAR */
  .mbanking-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(0, 0, 0, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .mbanking-brand-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .mbanking-brand {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.1rem;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .mbanking-brand span {
    color: var(--abu-terang);
  }

  .mbanking-greeting-top {
    font-size: 0.7rem;
    color: var(--abu-terang);
    font-family: 'FiraCondBold', sans-serif;
    margin-top: 1px;
    line-height: 1;
    text-transform: uppercase;
  }

  /* TOPBAR RIGHT CONTAINER UNTUK DROPDOWN */
  .topbar-right-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .profile-circle-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--abu);
    background: var(--abu-tua);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .profile-circle-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
  }

  .profile-circle-btn svg, .profile-circle-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-circle-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--abu-terang);
    padding: 2px;
  }

  /* DROPDOWN MENU PROFIL */
  .profile-dropdown-menu {
    position: absolute;
    top: 44px;
    right: 0;
    width: 170px;
    background: rgba(13, 13, 13, 0.96);
    border: 1.5px solid var(--abu-terang);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    padding: 6px;
    z-index: 999;
    backdrop-filter: blur(10px);
    
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.96);
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                visibility 0.25s;
  }

  .profile-dropdown-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    color: var(--abu-terang);
    text-decoration: none;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    background: none;
    border: none;
    text-align: left;
    width: 100%;
  }

  .dropdown-item:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  /* MAIN SCREEN */
  #screen-utang{
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 64px;
    padding-bottom: 80px;
    overflow-y: auto;
  }

  .section-wrap {
    width: 92%;
    max-width: 360px;
    margin-bottom: 14px;
  }

  .section-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    color: var(--abu-terang);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ============ UTANG DASHBOARD CARD ============ */
  .health-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0d0d0d, #1c1c1c);
    border: 2px solid var(--abu);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }

  .health-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .health-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.8rem;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .health-badge {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    background: rgba(255, 157, 92, 0.15);
    color: var(--oranye);
    border: 1px solid var(--oranye);
  }

  .ffp-bar-track {
    position: relative;
    width: 100%;
    height: 22px;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #333;
    margin-bottom: 12px;
  }

  .ffp-bar-fill {
    height: 100%;
    border-radius: 8px 0 0 8px;
    transition: width 0.5s ease;
    background: var(--oranye);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
  }

  .ffp-bar-fill span {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.65rem;
    color: #000;
  }

  .health-stats-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .health-stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 10px;
  }

  .health-stat-label {
    font-size: 0.6rem;
    color: #888;
    text-transform: uppercase;
  }

  .health-stat-val {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1rem;
    color: var(--abu-terang);
    margin-top: 2px;
  }

  /* ============ CARD LIST ORANG UTANG ============ */
  .utang-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .utang-empty {
    text-align: center;
    color: #666;
    font-size: 0.8rem;
    padding: 24px 10px;
    border: 1.5px dashed #333;
    border-radius: 12px;
  }

  .utang-card-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.85);
    border: 1.5px solid #333;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }

  .utang-card-item:active {
    transform: scale(0.98);
  }

  .utang-card-item:hover {
    border-color: var(--abu-terang);
  }

  .utang-person-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .utang-person-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 157, 92, 0.15);
    border: 1px solid var(--oranye);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--oranye);
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
  }

  .utang-person-name {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    color: #f0f0f0;
  }

  .utang-person-sub {
    font-size: 0.65px;
    color: #888;
    margin-top: 1px;
  }

  .utang-person-total {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    color: var(--oranye);
    text-align: right;
  }

  /* ============ FLOATING ADD BUTTON ============ */
  .fab-add-btn {
    position: fixed;
    bottom: 78px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--abu-terang);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 40;
    transition: transform 0.2s;
  }

  .fab-add-btn:active {
    transform: scale(0.9);
  }

  .fab-add-btn svg {
    width: 26px;
    height: 26px;
    fill: #000;
  }

  /* ============ POPUP / MODAL ============ */
  .popupBox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    padding: 20px;
  }

  .popupBox.active {
    display: flex;
  }

  .popupContent {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 340px;
    background: #000;
    border: 2px solid var(--abu-terang);
    border-radius: 20px;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .popupContent h2 {
    margin-top: 0;
    margin-bottom: 14px;
    font-family: 'FiraCondBold', sans-serif;
    color: var(--abu-terang);
    text-align: center;
    font-size: 1.1rem;
  }

  .form-label {
    font-size: 0.72rem;
    color: #999;
    font-family: 'FiraCondBold', sans-serif;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-input {
    width: 100%;
    height: 44px;
    background: #0d0d0d;
    border: 1px solid var(--abu);
    border-radius: 10px;
    color: #fff;
    padding: 0 12px;
    font-family: 'FiraCondBook', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--abu-terang);
  }

  textarea.form-input {
    height: 64px;
    padding: 10px 12px;
    resize: none;
    font-family: 'FiraCondBook', sans-serif;
  }

  .modal-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    text-align: center;
  }

  .modal-btn.simpan {
    background: var(--abu-terang);
    color: #000;
  }

  .modal-btn.batal {
    background: #1a1a1a;
    border: 1.5px solid #444;
    color: #aaa;
  }

  /* DETAIL UTANG MODAL STYLES */
  .detail-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }

  .detail-info {
    font-size: 0.75rem;
    color: #ddd;
  }

  .detail-date {
    font-size: 0.6rem;
    color: #888;
  }

  .detail-amount {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.85rem;
    color: var(--oranye);
  }

  .detail-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .detail-btn-action {
    flex: 1;
    padding: 6px;
    font-size: 0.7rem;
    border-radius: 6px;
    font-family: 'FiraCondBold', sans-serif;
    cursor: pointer;
    border: none;
    text-align: center;
  }

  .detail-btn-action.bayar {
    background: rgba(74, 222, 128, 0.15);
    color: var(--hijau);
    border: 1px solid var(--hijau);
  }

  .detail-btn-action.batal-bayar {
    background: rgba(255, 209, 102, 0.15);
    color: var(--kuning);
    border: 1px solid var(--kuning);
  }

  .detail-btn-action.hapus {
    background: rgba(255, 107, 107, 0.15);
    color: var(--merah);
    border: 1px solid var(--merah);
  }

  /* CUSTOM ALERT BOX */
  .custom-modal-box {
    background: #0d0d0d;
    border: 2px solid var(--abu-terang);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .custom-modal-title {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 1.1rem;
    color: var(--abu-terang);
    margin-bottom: 8px;
  }

  .custom-modal-msg {
    font-size: 0.9rem;
    color: #ddd;
    margin-bottom: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .custom-modal-buttons {
    display: flex;
    gap: 8px;
  }

  .custom-modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
  }

  .custom-modal-btn.primary {
    background: var(--abu-terang);
    color: #000;
  }

  .custom-modal-btn.secondary {
    background: #222;
    color: #aaa;
    border: 1px solid #444;
  }

  /* BOTTOM NAVBAR */
  .mbanking-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: rgba(0, 0, 0, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    z-index: 99999;
    backdrop-filter: blur(8px);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #888;
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.55rem;
    gap: 3px;
    padding: 4px 2px;
    transition: color 0.2s;
    cursor: pointer;
    background: none;
    border: none;
    min-width: 0;
  }

  .nav-item span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .nav-item.active, .nav-item:hover {
    color: var(--abu-terang);
  }
</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- TOP BAR -->
  <div class="mbanking-topbar">
    <div class="mbanking-brand-container">
      <div class="mbanking-brand">Kost<span>ku</span></div>
      <div class="mbanking-greeting-top">Utang</div>
    </div>
    
    <!-- WRAPPER KANAN PROFIL & DROPDOWN -->
    <div class="topbar-right-wrap">
      <div class="profile-circle-btn" id="topProfileBtn" onclick="toggleProfileDropdown(event)" title="Menu Profil">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>

      <div class="profile-dropdown-menu" id="profileDropdownMenu">
        <button type="button" class="dropdown-item" onclick="window.location.href='profile.html'">
          👤 Kunjungi Profil
        </button>
        <button type="button" class="dropdown-item" onclick="openPengaturanPage()">
          ⚙️ Pengaturan
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="screen-utang">

    <!-- UTANG HEALTH / RATIO DASHBOARD -->
    <div class="section-wrap">
      <div class="health-card">
        <div class="health-header">
          <div class="health-title">Rasio Pembayaran Utang</div>
          <div class="health-badge" id="utangBadge">AKTIF</div>
        </div>

        <div class="ffp-bar-track">
          <div class="ffp-bar-fill" id="utangBarFill" style="width:0%;">
            <span id="utangBarPercent">0% Lunas</span>
          </div>
        </div>

        <div class="health-stats-row">
          <div class="health-stat-box">
            <div class="health-stat-label">Total Sisa Utang</div>
            <div class="health-stat-val" id="statSisaUtang" style="color:var(--oranye);">Rp 0</div>
          </div>
          <div class="health-stat-box">
            <div class="health-stat-label">Sudah Dibayar</div>
            <div class="health-stat-val" id="statBayarUtang" style="color:var(--hijau);">Rp 0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- LIST CARD UTANG PER ORANG -->
    <div class="section-wrap">
      <div class="section-title">
        <span>Daftar Pemberi Utang</span>
      </div>
      <div class="utang-list" id="utangListContainer"></div>
    </div>

  </div>

  <!-- FLOATING ADD BUTTON -->
  <button class="fab-add-btn" id="fabAddBtn" onclick="openAddUtangPopup()">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <!-- BOTTOM NAVBAR -->
  <nav class="mbanking-bottom-nav" id="bottomNav"></nav>

  <!-- POPUP TAMBAH UTANG -->
  <div id="addUtangPopup" class="popupBox">
    <div class="popupContent">
      <h2>Tambah Utang</h2>

      <div class="form-group">
        <label class="form-label">Nama Pemberi Utang (Misal: Si A)</label>
        <input type="text" class="form-input" id="inputNamaPemberi" placeholder="Contoh: Budi">
      </div>

      <div class="form-group">
        <label class="form-label">Nominal (Rp)</label>
        <input type="number" inputmode="numeric" class="form-input" id="inputNominalUtang" placeholder="Contoh: 100000">
      </div>

      <div class="form-group">
        <label class="form-label">Tanggal</label>
        <input type="date" class="form-input" id="inputTanggalUtang">
      </div>

      <div class="form-group">
        <label class="form-label">Catatan (opsional)</label>
        <textarea class="form-input" id="inputCatatanUtang" placeholder="Keperluan utang..."></textarea>
      </div>

      <div class="modal-btn-row">
        <button type="button" class="modal-btn batal" onclick="closeAddUtangPopup()">Batal</button>
        <button type="button" class="modal-btn simpan" onclick="simpanUtangBaru()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- POPUP DETAIL UTANG PER ORANG -->
  <div id="detailUtangPopup" class="popupBox">
    <div class="popupContent">
      <h2 id="detailPopupTitle">Detail Utang</h2>
      <div id="detailUtangListContent" style="max-height: 250px; overflow-y: auto; margin-bottom: 12px;"></div>
      <button type="button" class="modal-btn batal" onclick="closeDetailUtangPopup()">Tutup</button>
    </div>
  </div>

  <!-- CUSTOM ALERT MODAL -->
  <div id="customModalOverlay" class="popupBox">
    <div class="custom-modal-box">
      <div class="custom-modal-title" id="customModalTitle">Informasi</div>
      <div class="custom-modal-msg" id="customModalMsg">Pesan...</div>
      <div class="custom-modal-buttons" id="customModalBtnContainer">
        <button type="button" class="custom-modal-btn primary" id="customModalOkBtn" onclick="closeCustomModal(true)">OK</button>
        <button type="button" class="custom-modal-btn secondary" id="customModalCancelBtn" onclick="closeCustomModal(false)" style="display:none;">Batal</button>
      </div>
    </div>
  </div>

  <script>
    let modalCallback = null;

    function showCustomAlert(message, title = "Informasi") {
      return new Promise((resolve) => {
        document.getElementById("customModalTitle").innerText = title;
        document.getElementById("customModalMsg").innerText = message;
        document.getElementById("customModalCancelBtn").style.display = "none";
        document.getElementById("customModalOverlay").classList.add("active");
        modalCallback = (res) => resolve(res);
      });
    }

    function showCustomConfirm(message, title = "Konfirmasi") {
      return new Promise((resolve) => {
        document.getElementById("customModalTitle").innerText = title;
        document.getElementById("customModalMsg").innerText = message;
        document.getElementById("customModalCancelBtn").style.display = "block";
        document.getElementById("customModalOverlay").classList.add("active");
        modalCallback = (res) => resolve(res);
      });
    }

    function closeCustomModal(result) {
      document.getElementById("customModalOverlay").classList.remove("active");
      if(modalCallback) {
        modalCallback(result);
        modalCallback = null;
      }
    }

    // Load Profile Picture
    window.addEventListener("DOMContentLoaded", () => {
      const savedPic = localStorage.getItem("profile_picture") || localStorage.getItem("user_avatar");
      if(savedPic) {
        const topBtn = document.getElementById("topProfileBtn");
        topBtn.innerHTML = `<img src="${savedPic}" alt="Profile">`;
      }
    });

    function toggleProfileDropdown(event) {
      event.stopPropagation();
      const menu = document.getElementById("profileDropdownMenu");
      menu.classList.toggle("active");
    }

    window.addEventListener("click", () => {
      const menu = document.getElementById("profileDropdownMenu");
      if (menu.classList.contains("active")) {
        menu.classList.remove("active");
      }
    });

    function openPengaturanPage() {
      showCustomAlert("Halaman Pengaturan segera hadir!", "Pengaturan");
    }

    const STORAGE_KEY_UTANG = "kostku_data_utang";

    function getUtangList() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_UTANG);
        return raw ? JSON.parse(raw) : [];
      } catch(e) {
        return [];
      }
    }

    function saveUtangList(list) {
      localStorage.setItem(STORAGE_KEY_UTANG, JSON.stringify(list));
    }

    function formatIDR(num) {
      num = Math.round(num);
      return "Rp " + num.toLocaleString('id-ID');
    }

    function todayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth()+1).padStart(2,'0');
      const d = String(now.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }

    function openAddUtangPopup() {
      document.getElementById("inputNamaPemberi").value = "";
      document.getElementById("inputNominalUtang").value = "";
      document.getElementById("inputCatatanUtang").value = "";
      document.getElementById("inputTanggalUtang").value = todayDateStr();
      document.getElementById("addUtangPopup").classList.add("active");
    }

    function closeAddUtangPopup() {
      document.getElementById("addUtangPopup").classList.remove("active");
    }

    async function simpanUtangBaru() {
      const nama = document.getElementById("inputNamaPemberi").value.trim();
      const nominal = parseFloat(document.getElementById("inputNominalUtang").value);
      const tanggal = document.getElementById("inputTanggalUtang").value;
      const catatan = document.getElementById("inputCatatanUtang").value.trim();

      if (!nama) {
        await showCustomAlert("Nama pemberi utang harus diisi!", "Kesalahan");
        return;
      }
      if (isNaN(nominal) || nominal <= 0) {
        await showCustomAlert("Nominal harus valid dan lebih dari 0!", "Kesalahan");
        return;
      }
      if (!tanggal) {
        await showCustomAlert("Tanggal harus diisi!", "Kesalahan");
        return;
      }

      let list = getUtangList();
      list.push({
        id: "u_" + Date.now() + "_" + Math.floor(Math.random()*1000),
        nama: nama,
        nominal: nominal,
        tanggal: tanggal,
        catatan: catatan,
        status: "belum" // belum / lunas
      });

      saveUtangList(list);
      closeAddUtangPopup();
      renderUtangPage();
    }

    function renderUtangPage() {
      const list = getUtangList();
      
      let grouped = {};
      let totalSisaSemua = 0;
      let totalBayarSemua = 0;

      list.forEach(item => {
        if (!grouped[item.nama]) {
          grouped[item.nama] = { totalUtang: 0, totalBayar: 0, items: [] };
        }
        grouped[item.nama].items.push(item);
        if (item.status === 'lunas') {
          grouped[item.nama].totalBayar += item.nominal;
          totalBayarSemua += item.nominal;
        } else {
          grouped[item.nama].totalUtang += item.nominal;
          totalSisaSemua += item.nominal;
        }
      });

      const totalKeseluruhan = totalSisaSemua + totalBayarSemua;
      let rasioBayar = totalKeseluruhan > 0 ? (totalBayarSemua / totalKeseluruhan) * 100 : 0;

      document.getElementById("utangBarFill").style.width = Math.min(rasioBayar, 100) + "%";
      document.getElementById("utangBarPercent").innerText = Math.round(rasioBayar) + "% Lunas";
      document.getElementById("statSisaUtang").innerText = formatIDR(totalSisaSemua);
      document.getElementById("statBayarUtang").innerText = formatIDR(totalBayarSemua);

      localStorage.setItem("kostku_total_debt", totalSisaSemua);

      const container = document.getElementById("utangListContainer");
      const names = Object.keys(grouped);

      if (names.length === 0) {
        container.innerHTML = `<div class="utang-empty">Belum ada catatan utang.</div>`;
        return;
      }

      container.innerHTML = names.map(nama => {
        const data = grouped[nama];
        const sisaOrang = data.totalUtang;
        const initial = nama.charAt(0).toUpperCase();

        return `
          <div class="utang-card-item" onclick="openDetailUtang('${nama}')">
            <div class="utang-person-info">
              <div class="utang-person-avatar">${initial}</div>
              <div>
                <div class="utang-person-name">${nama}</div>
                <div class="utang-person-sub">${data.items.length} catatan transaksi</div>
              </div>
            </div>
            <div class="utang-person-total">
              ${formatIDR(sisaOrang)}
            </div>
          </div>
        `;
      }).join("");
    }

    let activePerson = null;

    function openDetailUtang(nama) {
      activePerson = nama;
      const list = getUtangList().filter(i => i.nama === nama);
      
      document.getElementById("detailPopupTitle").innerText = "Utang ke: " + nama;
      const container = document.getElementById("detailUtangListContent");

      container.innerHTML = list.map(item => {
        const isLunas = item.status === 'lunas';
        return `
          <div class="detail-item" style="${isLunas ? 'opacity: 0.6;' : ''}">
            <div>
              <div class="detail-info">${item.catatan ? item.catatan : 'Tanpa catatan'}</div>
              <div class="detail-date">${item.tanggal} ${isLunas ? '<b>(Lunas)</b>' : ''}</div>
              <div class="detail-amount">${formatIDR(item.nominal)}</div>
            </div>
            <div class="detail-actions">
              ${!isLunas 
                ? `<button type="button" class="detail-btn-action bayar" onclick="toggleBayarUtang('${item.id}')">Bayar</button>` 
                : `<button type="button" class="detail-btn-action batal-bayar" onclick="toggleBayarUtang('${item.id}')">Batal Bayar</button>`
              }
              <button type="button" class="detail-btn-action hapus" onclick="konfirmasiHapusUtang('${item.id}')">Hapus</button>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("detailUtangPopup").classList.add("active");
    }

    function closeDetailUtangPopup() {
      document.getElementById("detailUtangPopup").classList.remove("active");
    }

    // Toggle bayar atau batal bayar
    function toggleBayarUtang(id) {
      let list = getUtangList();
      list = list.map(i => {
        if (i.id === id) {
          const newStatus = i.status === 'lunas' ? 'belum' : 'lunas';
          return { ...i, status: newStatus };
        }
        return i;
      });
      saveUtangList(list);
      renderUtangPage();
      openDetailUtang(activePerson);
    }

    // Konfirmasi sebelum hapus permanen
    async function konfirmasiHapusUtang(id) {
      const conf = await showCustomConfirm("Yakin mau menghapus transaksi utang ini?", "Konfirmasi Hapus");
      if (!conf) return;

      let list = getUtangList();
      list = list.filter(i => i.id !== id);
      saveUtangList(list);
      renderUtangPage();
      
      const sisa = list.filter(i => i.nama === activePerson);
      if (sisa.length === 0) {
        closeDetailUtangPopup();
      } else {
        openDetailUtang(activePerson);
      }
    }

    // BOTTOM NAVBAR
    const navItems = [
      { href: "index.html",          label: "Home",
        svg: `<path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3l9-8z"/>` },
      { href: "kelola-uang.html",    label: "Uang",
        svg: `<path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>` },
      { href: "utang.html",          label: "Utang", active: true,
        svg: `<path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>` },
      { href: "rekap.html",          label: "Rekap",
        svg: `<path d="M3 3v18h18V3H3zm4 14H5v-4h2v4zm4 0h-2V9h2v8zm4 0h-2v-6h2v6zm4 0h-2V7h2v10z"/>` },
      { href: "penagihan.html",      label: "Penagihan",
        svg: `<path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/>` },
      { href: "profile.html",        label: "Profil",
        svg: `<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>` }
    ];

    function renderBottomNav() {
      const nav = document.getElementById("bottomNav");
      nav.innerHTML = navItems.map(item => `
        <a href="${item.href}" class="nav-item ${item.active ? 'active' : ''}">
          <svg viewBox="0 0 24 24">${item.svg}</svg>
          <span>${item.label}</span>
        </a>
      `).join("");
    }

    function init() {
      renderBottomNav();
      renderUtangPage();
    }

    init();
  </script>

</body>
</html>
